/* «Энергоконтур» · угольная тема (#30343b → #3a3f47 → #454a53) и светлая; глубина только светлотой, без теней и рамок у карточек.
   Один цвет данных — тепловой оранжевый: перерасход и расход после меры. Кнопки, вкладки и меню его не используют.
   Сетка: сайдбар 220 + полотно с полями 29px; один зазор 14px по горизонтали и вертикали. */
:root{
  color-scheme:dark;
  --ground:#30343b;--surface:#3a3f47;--raised:#454a53;--nested:#4d535c;
  --border:#40454d;--rule:#4a4f58;--control:#6b717b;--control-hover:#8c929b;
  --text:#fff;--muted:#cfd2d7;--faint:#b0b4bb;--nav:#d3d6da;--sep:#7c828b;
  --hover:#363a42;--cell:#454a53;--input:#2b2f35;--done-bar:#7c828b;
  --primary:#fff;--on-primary:#1f2227;--primary-hover:#e4e6e9;--disabled-bg:#454a53;--disabled-ink:#9aa0a8;
  --heat:#ff8a1f;--heat-line:#ff8a1f;--heat-ink:#ffb067;--heat-bg:#54402c;
  --positive:#5fd394;--pill-pos-bg:#2f4a3c;
  --negative:#ff8095;--pill-neg-bg:#55343c;
  --warning:#f0b955;--pill-warn-bg:#4f4532;
  --pill-neutral:#4d535c;
  --chart-grid:#4f555e;--chart-prev:#a7acb3;--chart-base:#9aa0a8;--chart-span:#41464e;--chart-zero:#6b717b;
  --r-card:20px;--r-nested:12px;--r-ctl:999px;
  --gap:14px;--pad:22px;--ctl:36px;
  --fs-title:22px;--fs-section:16px;--fs-kpi:26px;--fs-body:14px;--fs-small:12px;
  --font:'Manrope',system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
:root[data-theme=light]{
  color-scheme:light;
  --ground:#eef0f3;--surface:#ffffff;--raised:#f3f4f6;--nested:#e9ebee;
  --border:#dcdfe4;--rule:#e8eaed;--control:#c3c8cf;--control-hover:#8c929b;
  --text:#1f2329;--muted:#4a5059;--faint:#626872;--nav:#3d434c;--sep:#a3a9b1;
  --hover:#e4e7eb;--cell:#eceef1;--input:#ffffff;--done-bar:#a3a9b1;
  --primary:#30343b;--on-primary:#ffffff;--primary-hover:#1f2329;--disabled-bg:#e4e7eb;--disabled-ink:#6b717b;
  --heat:#ff8a1f;--heat-line:#ea7410;--heat-ink:#a24a00;--heat-bg:#ffead6;
  --positive:#1f7a4d;--pill-pos-bg:#dcf5e7;
  --negative:#b4233c;--pill-neg-bg:#fde6ea;
  --warning:#8a5a00;--pill-warn-bg:#fdf1d8;
  --pill-neutral:#eceef1;
  --chart-grid:#e5e7eb;--chart-prev:#7c828b;--chart-base:#8c929b;--chart-span:#f3f4f6;--chart-zero:#c3c8cf;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--text)}
body{font:400 var(--fs-body)/20px var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--heat);color:#000}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:var(--control) transparent}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- оболочка: сайдбар + верхняя строка на одном фоне, разделены 1px */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.main{min-width:0}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0 10px 16px}
.brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none}
.mark{width:30px;height:30px;border-radius:9px;background:var(--heat);display:grid;place-items:center;flex:none}
.mark svg{width:17px;height:17px}
.brand b{display:block;font-size:15px;font-weight:600;line-height:18px}
.brand small{display:block;font-size:12px;color:var(--faint);line-height:16px}
.navgroup{font-size:12px;color:var(--faint);padding:18px 10px 8px}
.nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:10px;color:var(--nav);text-decoration:none;transition:color .15s,background-color .15s}
.nav a svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav a:hover{color:var(--text);background:var(--hover)}
.nav a[aria-current=page]{color:var(--text);font-weight:600}
.nav a[aria-current=page] svg{opacity:1}
.nav .count{margin-left:auto;font-size:12px;color:var(--faint);font-weight:400}
.side-foot{margin-top:auto;padding:12px 10px 0;font-size:12px;line-height:17px;color:var(--faint)}
.side-foot b{color:var(--muted);font-weight:500}

.top{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 0 0 29px;position:sticky;top:0;background:var(--ground);z-index:5}
.crumbs{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumbs i{font-style:normal;color:var(--sep)}
.top-right{display:flex;align-items:center;height:100%}
.top-right .stamp{font-size:12px;color:var(--faint);padding:0 16px;white-space:nowrap}
.switcher{height:100%;display:flex;align-items:center;gap:10px;padding:0 24px 0 20px;border-left:1px solid var(--border);white-space:nowrap}
.switcher .dot{width:22px;height:22px;border-radius:7px;background:var(--raised);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.switcher b{display:block;font-size:13px;font-weight:600;line-height:16px}
.switcher small{display:block;font-size:12px;color:var(--faint);line-height:15px}
.menu-btn{display:none}
.theme-btn{height:34px;width:34px;margin-right:12px;border-radius:999px;border:1px solid var(--control);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;transition:background-color .15s,border-color .15s}
.theme-btn:hover{background:var(--hover);border-color:var(--control-hover)}
.theme-btn svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.theme-btn .sun{display:none}
:root[data-theme=light] .theme-btn .sun{display:block}
:root[data-theme=light] .theme-btn .moon{display:none}

.canvas{padding:24px 29px 40px;display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:4px 0 10px}
h1{font-size:var(--fs-title);line-height:30px;font-weight:600;letter-spacing:-.01em}
.titlerow p{margin-top:4px;color:var(--muted);font-size:15px;line-height:22px;max-width:760px}
.titlerow p b{color:var(--text);font-weight:600}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none}

/* ---------- кнопки: главная — белая инверсия, остальные — контур */
.btn{height:var(--ctl);padding:0 16px;border-radius:var(--r-ctl);border:1px solid var(--control);background:transparent;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color .15s,border-color .15s,transform .12s var(--ease),opacity .15s;text-decoration:none}
.btn:hover{border-color:var(--control-hover);background:var(--hover)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn:disabled{cursor:not-allowed;opacity:1;background:transparent;border-color:var(--rule);color:var(--disabled-ink);transform:none}
.btn.primary:disabled{background:var(--disabled-bg);border-color:var(--disabled-bg);color:var(--disabled-ink)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--control);text-underline-offset:3px}
.link:hover{color:var(--text);text-decoration-color:var(--text)}

/* ---------- карточки: только ступень светлоты */
.card{background:var(--surface);border-radius:var(--r-card);padding:var(--pad);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h2{font-size:var(--fs-section);font-weight:600;line-height:22px}
.card-h span,.card-h .meta{font-size:12px;color:var(--faint);white-space:nowrap}
.nested{background:var(--raised);border-radius:var(--r-nested);padding:16px}
.grid{display:grid;gap:var(--gap)}
.g-main{grid-template-columns:minmax(0,1fr) 380px;align-items:start}
.g-2{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:var(--gap)}

/* ---------- KPI: один контейнер, разделённый 1px */
.kpis{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.kpis>div{padding:0 20px;min-width:0}
.kpis>div:first-child{padding-left:0}
.kpis>div+div{border-left:1px solid var(--rule)}
.kpis small{display:block;font-size:13px;color:var(--muted);line-height:18px}
.kpis b{display:block;font-size:var(--fs-kpi);line-height:34px;font-weight:500;letter-spacing:-.01em;margin-top:4px;white-space:nowrap}
.kpis b u{text-decoration:none;font-size:14px;color:var(--faint);font-weight:400;margin-left:5px}
.kpis b.lead{font-size:32px;line-height:40px}
.kpis b.dash{color:var(--faint)}
.kpis em{display:block;font-style:normal;font-size:12px;color:var(--faint);margin-top:2px}
.kpis em.ok{color:var(--positive)}

/* ---------- пилюли статусов */
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--pill-neutral);color:var(--text)}
.pill.heat{background:var(--heat-bg);color:var(--heat-ink)}
.pill.ok{background:var(--pill-pos-bg);color:var(--positive)}
.pill.bad{background:var(--pill-neg-bg);color:var(--negative)}
.pill.warn{background:var(--pill-warn-bg);color:var(--warning)}
.pill.muted{color:var(--muted)}

/* ---------- маршрут приёмки: четыре шага */
.route{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0;overflow:hidden}
.route li{position:relative;padding:18px 20px 18px;display:flex;flex-direction:column;gap:3px;min-width:0}
.route li+li{border-left:1px solid var(--rule)}
.route li::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:transparent;transition:background-color .3s}
.route .s-k{font-size:12px;color:var(--faint)}
.route .s-t{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.route .s-w{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route .done::before{background:var(--done-bar)}
.route .done .s-t svg{width:14px;height:14px;stroke:var(--positive);fill:none;stroke-width:2.2}
.route .cur{background:var(--raised)}
.route .cur::before{background:var(--text)}
.route .stop::before{background:var(--negative)}
.route .todo .s-t{color:var(--muted)}

/* ---------- контуры: вкладки-объекты */
.ctabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.ctab{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border-radius:16px;padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;outline:1px solid transparent;outline-offset:-1px;transition:background-color .15s,outline-color .15s}
.ctab:hover{background:var(--hover)}
.ctab:focus-visible{outline:2px solid var(--text)}
.ctab[aria-selected=true]{outline:1.5px solid var(--text);background:var(--surface)}
.ctab b{font-size:15px;font-weight:600;grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctab span{font-size:13px;color:var(--muted);grid-column:1}
.ctab .pill{grid-row:2;grid-column:2}

/* ---------- графики */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);font-size:12px;fill:var(--faint)}
.chart .lab{fill:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.legend i.d{border-top-style:dashed}
.heat-strip{display:grid;grid-template-columns:repeat(60,minmax(0,1fr));gap:2px;height:20px}
.heat-strip i{border-radius:2px;background:var(--cell)}
.heat-strip i.na{background:transparent;outline:1px dashed var(--sep);outline-offset:-1px}
.heat-scale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint)}
.heat-scale span.bar{display:flex;gap:2px}
.heat-scale span.bar i{width:14px;height:10px;border-radius:2px}

/* ---------- обзор: тепловая карта контуров */
.hm-row{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:16px;align-items:center;padding:9px 0}
.hm-row+.hm-row{border-top:1px solid var(--rule)}
.hm-row .id b{display:block;font-weight:600}
.hm-row .id span{font-size:12px;color:var(--faint)}
.hm-row .v{text-align:right;font-size:13px;color:var(--muted)}
.hm-row .v b{display:block;color:var(--text);font-weight:500;font-size:14px}
.hm-axis{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:16px;font-size:12px;color:var(--faint);padding-top:6px}
.hm-axis div{display:flex;justify-content:space-between}

/* ---------- таблицы и списки */
table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:400;color:var(--faint);text-align:left;padding:0 12px 10px 0;white-space:nowrap}
td{padding:13px 12px 13px 0;border-top:1px solid var(--rule);vertical-align:middle}
th:last-child,td:last-child{padding-right:0}
td.num,th.num{text-align:right}
td .sub{display:block;font-size:12px;color:var(--faint);margin-top:2px}
tr.clickable{cursor:pointer;transition:background-color .15s}
tr.clickable:hover td{background:var(--hover)}
.queue td:first-child b{font-weight:600}
.check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;cursor:pointer;line-height:20px}
.check+.check{border-top:1px solid var(--rule)}
.check input{appearance:none;flex:none;width:18px;height:18px;margin:1px 0 0;border:1.5px solid var(--control);border-radius:5px;background:transparent;display:grid;place-items:center;cursor:pointer;transition:background-color .15s,border-color .15s}
.check input:checked{background:var(--text);border-color:var(--text)}
.check input:checked::after{content:'';width:9px;height:5px;border:2px solid var(--surface);border-top:0;border-right:0;transform:translate(0,-1px) rotate(-45deg)}
.check input:disabled{border-color:var(--rule)}
.check input:disabled+span{color:var(--disabled-ink)}
.check span small{display:block;font-size:12px;color:var(--faint)}
.task h3{font-size:16px;font-weight:600;line-height:22px}
.task p{color:var(--muted);margin-top:6px;line-height:21px}
.task .actions{margin-top:16px}
.reason{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:12px;line-height:19px}
.reason svg{width:15px;height:15px;flex:none;margin-top:2px;stroke:currentColor;fill:none;stroke-width:1.6}
.reason.bad{color:var(--negative)}
.reason.ok{color:var(--positive)}
.field{display:grid;gap:8px;font-size:14px;font-weight:500}
.field input{height:40px;border-radius:10px;border:1px solid var(--control);background:var(--input);padding:0 12px;font-weight:400;font-size:15px;width:100%;transition:border-color .15s}
.field input:hover{border-color:var(--control-hover)}
.field input:focus{border-color:var(--text);outline:none}
.field input[aria-invalid=true]{border-color:var(--negative)}
.field small{font-weight:400;font-size:12px;color:var(--faint)}
.log li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;font-size:13px;line-height:19px}
.log li+li{border-top:1px solid var(--rule)}
.log time{color:var(--faint)}
.log b{font-weight:500}
.empty{border:1px dashed var(--control);border-radius:12px;padding:12px 14px;color:var(--faint);font-size:13px}
.note{font-size:12px;line-height:18px;color:var(--faint)}
.note b{color:var(--muted);font-weight:500}
.dl{display:grid;grid-template-columns:1fr auto;gap:0 16px}
.dl dt,.dl dd{padding:9px 0;border-top:1px solid var(--rule)}
.dl dt:first-of-type,.dl dd:first-of-type{border-top:0}
.dl dt{color:var(--muted)}
.dl dd{text-align:right;font-weight:500}
.seg{display:inline-flex;background:var(--raised);border-radius:999px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;transition:background-color .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--on-primary)}
.formula{font-size:20px;line-height:28px;font-weight:500;letter-spacing:-.01em}
.formula u{text-decoration:none;color:var(--faint);font-weight:400}
.src{padding:16px 0}
.src+.src{border-top:1px solid var(--rule)}
.src h3{font-size:15px;font-weight:600;margin:2px 0 6px}
.src p{color:var(--muted);line-height:21px;max-width:860px}
.src .k{font-size:12px;color:var(--faint)}
.src a{font-size:13px;color:var(--text);text-underline-offset:3px;text-decoration-color:var(--sep);display:inline-block;margin-top:6px}
.tree{display:grid;gap:12px}
.tree .core{background:var(--raised);border-radius:var(--r-nested);padding:16px 18px}

.tree .br{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tree .br div{border:1px solid var(--rule);border-radius:var(--r-nested);padding:12px 14px}
.tree .br b{display:block;font-weight:600}
.tree .br span{font-size:12px;color:var(--faint)}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 0}
.steps li+li{border-top:1px solid var(--rule)}
.steps .n{width:24px;height:24px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.steps b{display:block;font-weight:600}
.steps p{color:var(--muted);line-height:20px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--primary);color:var(--on-primary);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s var(--ease);z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3)} /* taste-skill-ignore: всплывающее уведомление */
.toast.on{opacity:1;transform:translate(-50%,0)}
.view{animation:viewIn .28s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.flash{animation:flash .9s var(--ease)}
@keyframes flash{0%{background:var(--raised)}100%{background:var(--surface)}}

<script>
/* ---- data.js ---- */
// Учебные (синтетические) данные MVP «Энергоконтур». Не данные КМГ.
// Суточные ряды строятся детерминированно и масштабируются так, чтобы суммы точно совпали с итогами контуров.

const DAYS = 60, SPLIT = 30;                       // 30 суток до устранения и 30 после
const START = Date.UTC(2026, 7, 22);               // 22.08.2026 — первый день ряда; устранение 20.09; данные по 20.10
const dayDate = i => new Date(START + i * 864e5);
const ddmm = i => { const d = dayDate(i); return String(d.getUTCDate()).padStart(2, '0') + '.' + String(d.getUTCMonth() + 1).padStart(2, '0') };

function rng(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280 - .5 }
// ряд из n значений вокруг level с шумом amp, сумма ровно total (поправка разнесена пропорционально)
function series(n, level, amp, total, seed, gaps = []) {
  const r = rng(seed), v = Array.from({ length: n }, (_, i) => gaps.includes(i) ? null : level * (1 + r() * amp));
  const sum = v.reduce((a, x) => a + (x ?? 0), 0), k = total / sum;
  const out = v.map(x => x === null ? null : Math.round(x * k));
  const diff = total - out.reduce((a, x) => a + (x ?? 0), 0);
  const last = out.findLastIndex(x => x !== null); out[last] += diff;
  return out;
}

const KWH_BEFORE = 8333333;                        // 30 суток до меры, кВт·ч
const EFF = 269444;                                // модель эффективного расхода ИИ при полном выпуске, кВт·ч/сут

const CIRCUITS = [
  {
    id: 'EC-01', name: 'Технический воздух', kind: 'loss', role: 'Проверяемый результат',
    plant: 'Компрессорная № 2 · сеть техвоздуха 0,7 МПа',
    story: 'Оператор услышал шипение на фланце коллектора. Бригада меняет прокладку — утечка уходит.',
    rawBase: KWH_BEFORE, expected: KWH_BEFORE, actual: 8083333, days: 30, uncertainty: 1, output: [1, 1],
  },
  {
    id: 'EC-02', name: 'Ниже выпуск', kind: 'output', role: 'Ложный вывод',
    plant: 'Компрессорная № 1 · установка с плановым снижением загрузки',
    story: 'Бригада подтянула соединения. В тот же месяц загрузку установки снизили на 10 %.',
    rawBase: KWH_BEFORE, expected: 7500000, actual: 7500000, days: 30, uncertainty: 1, output: [1, .9],
  },
  {
    id: 'EC-03', name: 'Неполный учёт', kind: 'missing', role: 'Мало данных',
    plant: 'Компрессорная № 3 · счётчик на вводе 0,4 кВ',
    story: 'Бригада устранила утечку на ресивере. Счётчик на вводе за 3 суток не передал показания.',
    rawBase: KWH_BEFORE, expected: KWH_BEFORE, actual: 7275000, days: 27, uncertainty: 1, output: [1, 1], gaps: [11, 17, 22],
  },
];

for (const [n, c] of CIRCUITS.entries()) {
  const before = series(SPLIT, KWH_BEFORE / SPLIT, .016, c.rawBase, 11 + n * 7);
  const after = series(DAYS - SPLIT, c.actual / c.days, .014, c.actual, 29 + n * 5, c.gaps || []);
  c.daily = before.concat(after);
  // база для текущего режима по суткам (до меры, приведённая к выпуску) и модель эффективного расхода ИИ
  c.baseDaily = c.daily.map((_, i) => Math.round(KWH_BEFORE / SPLIT * c.output[i < SPLIT ? 0 : 1]));
  c.modelDaily = c.daily.map((_, i) => Math.round(EFF * c.output[i < SPLIT ? 0 : 1]));
  console.assert(before.reduce((a, b) => a + b, 0) === c.rawBase, c.id + ': сумма до меры');
  console.assert(after.reduce((a, b) => a + (b ?? 0), 0) === c.actual, c.id + ': сумма после меры');
  console.assert(after.filter(x => x !== null).length === c.days, c.id + ': суток с учётом');
}

const FINANCE = { qty: 3000000, unit: 30, launch: 36, months: 4, co2: 0.6 };
const BASE_KWH = 100000000;                        // условная годовая база ДЗО, кВт·ч
const SCENARIOS = [[1, 1000000], [3, 3000000], [5, 5000000]];
const BUDGET = [
  ['База и измерения', 8, 'Обследование контуров, проверка счётчиков, базовая модель'],
  ['Интеграция и модель ИИ', 10, 'Архив измерений, модель эффективного расхода, карточки сигналов'],
  ['Физические меры и приборы', 12, 'Условный резерв на устранение утечек и средства измерения'],
  ['Проверка, приёмка, обучение', 6, 'Протокол замера, приёмка энергетиком и финансистом, обучение'],
];
console.assert(BUDGET.reduce((a, b) => a + b[1], 0) === FINANCE.launch, 'бюджет = 36 млн тг');

const KMG = { total: 124.9, measures: 87, saved: 1.935 }; // отчёт КМГ за 2025 год, млн ГДж

// SVG-графики «Энергоконтура»: одна серия — один цвет данных, 3–5 бледных линий сетки, без оси Y, подписи не пересекаются.
const NARROW = () => globalThis.innerWidth < 700;
// цвета берутся из CSS-переменных текущей темы (угольная или светлая) в момент отрисовки
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const F = (n, d = 0) => new Intl.NumberFormat('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d }).format(n);
const niceStep = span => { const raw = span / 4, p = 10 ** Math.floor(Math.log10(raw)), m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p };

// суточный расход контура: 30 суток до (серый) и 30 после меры (оранжевый), база — пунктир
function dailyChart(c, { compact = false, hideAfter = false } = {}) {
  const idx = DATA.CIRCUITS.findIndex(x => x.id === c.id);
  if (hideAfter) c = { ...c, daily: c.daily.map((v, k) => k < DATA.SPLIT ? v : undefined) };
  const W = NARROW() ? 440 : 860, H = NARROW() ? 240 : compact ? 220 : 262, L = 40, R = 12, T = 30, B = 30;
  const vals = c.daily.filter(v => v !== null && v !== undefined).concat(c.baseDaily).map(v => v / 1000);
  const step = niceStep(Math.max(...vals) - Math.min(...vals) + 4);
  const lo = Math.floor((Math.min(...vals) - 1) / step) * step, hi = Math.ceil((Math.max(...vals) + 1) / step) * step;
  const X = i => L + i / (c.daily.length - 1) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<path d="M${L} ${Y(v).toFixed(1)}H${W - R}" stroke="${tok('--chart-grid')}"/><text x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${F(v)}</text>`;
  const line = (a, b, arr) => { let d = '', pen = false; for (let i = a; i < b; i++) { const v = arr[i]; if (v === null || v === undefined) { pen = false; continue } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v / 1000).toFixed(1); pen = true } return d };
  const S = DATA.SPLIT, mx = X(S - .5);
  g += `<path d="${line(0, c.baseDaily.length, c.baseDaily)}" stroke="${tok('--chart-base')}" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>`;
  g += `<path d="M${mx.toFixed(1)} ${T - 14}V${H - B}" stroke="${tok('--sep')}" stroke-dasharray="3 3"/>`;
  g += `<text x="${(mx + 6).toFixed(1)}" y="${T - 4}" class="lab">${c.kind === 'output' ? 'Загрузка снижена на 10 %' : 'Устранение · акт Р-0' + (idx + 1)}</text>`;
  g += `<path d="${line(0, S, c.daily)}" stroke="${tok('--chart-prev')}" stroke-width="2" fill="none" stroke-linejoin="round"/>`;
  g += `<path class="after" d="${line(S - 1, c.daily.length, c.daily)}" stroke="${tok('--heat-line')}" stroke-width="2.5" fill="none" stroke-linejoin="round"/>`;
  c.daily.forEach((v, i) => { if (v === null) g += `<text x="${X(i).toFixed(1)}" y="${(H - B - 6).toFixed(1)}" text-anchor="middle" style="fill:${tok('--negative')};font-size:13px">×</text>` });
  for (const i of NARROW() ? [0, 20, 40, 59] : [0, 10, 20, 30, 40, 50, 59]) g += `<text x="${X(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === 59 ? 'end' : 'middle'}">${DATA.ddmm(i)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Суточный расход ${c.id}, тыс. кВт·ч: 30 суток до и 30 после меры">${g}</svg>`;
}

// тепловая полоса: перерасход к модели ИИ по суткам (0 → 4 % и выше), пропуск учёта — штриховка
const heatLevel = (v, m) => v === null ? null : Math.max(0, Math.min(1, ((v - m) / m) / 0.04));
function heatStrip(c, { hideAfter = false } = {}) {
  return `<div class="heat-strip" role="img" aria-label="Перерасход к модели ИИ по суткам, ${c.id}">` + c.daily.map((v, i) => {
    if (hideAfter && i >= DATA.SPLIT) return '<i></i>';
    const k = heatLevel(v, c.modelDaily[i]);
    return k === null ? `<i class="na" title="${DATA.ddmm(i)}: нет показаний"></i>` : `<i style="background:rgba(255,138,31,${(.07 + k * .93).toFixed(2)})" title="${DATA.ddmm(i)}: ${F((v - c.modelDaily[i]) / c.modelDaily[i] * 100, 1)} % к модели"></i>`;
  }).join('') + '</div>';
}
const heatScale = () => `<div class="heat-scale"><span>0 %</span><span class="bar">${[0, .25, .5, .75, 1].map(k => `<i style="background:rgba(255,138,31,${(.07 + k * .93).toFixed(2)})"></i>`).join('')}</span><span>4 % и выше к модели ИИ</span><span class="bar"><i style="outline:1px dashed var(--sep);outline-offset:-1px"></i></span><span>нет учёта</span></div>`;

// накопленная валовая экономия за 24 месяца; пунктир — разовый запуск, точка — покрытие запуска
function econChart(r) {
  if (!r.valid) return '<div class="empty">Проверьте допущения: нужны неотрицательные числа.</div>';
  const W = NARROW() ? 440 : 860, H = NARROW() ? 260 : 280, L = 44, R = 14, T = 26, B = 30;
  const top = Math.max(1, r.launch, r.gross * Math.max(0, 24 - r.months) / 12), step = niceStep(top * 1.08), hi = Math.ceil(top * 1.08 / step) * step;
  const X = m => L + m / 24 * (W - L - R), Y = v => T + (hi - v) / hi * (H - T - B);
  let g = `<rect x="${L}" y="${T}" width="${(X(Math.min(r.months, 24)) - L).toFixed(1)}" height="${H - T - B}" fill="${tok('--chart-span')}"/>`;
  for (let v = 0; v <= hi + 1e-9; v += step) g += `<path d="M${L} ${Y(v).toFixed(1)}H${W - R}" stroke="${v ? tok('--chart-grid') : tok('--chart-zero')}"/><text x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${F(v)}</text>`;
  g += `<text x="${(L + 8).toFixed(1)}" y="${T + 18}" class="lab">Внедрение ${F(r.months)} мес.</text>`;
  g += `<path d="M${L} ${Y(r.launch).toFixed(1)}H${W - R}" stroke="${tok('--chart-base')}" stroke-width="1.5" stroke-dasharray="6 5"/><text x="${W - R}" y="${(Y(r.launch) - 7).toFixed(1)}" text-anchor="end" class="lab">Разовый запуск ${F(r.launch, 1)} млн тг</text>`;
  const pts = Array.from({ length: 25 }, (_, m) => (m ? 'L' : 'M') + X(m).toFixed(1) + ' ' + Y(r.gross * Math.max(0, m - r.months) / 12).toFixed(1)).join(' ');
  g += `<path d="${pts}" stroke="${tok('--heat-line')}" stroke-width="2.5" fill="none" stroke-linejoin="round"/>`;
  if (r.cover !== null && r.cover <= 24 && r.launch > 0) g += `<circle cx="${X(r.cover).toFixed(1)}" cy="${Y(r.launch).toFixed(1)}" r="5" fill="${tok('--text')}"/><text x="${(X(r.cover) + 10).toFixed(1)}" y="${(Y(r.launch) + 18).toFixed(1)}" class="lab">≈ ${F(r.cover, 1)} мес.</text>`;
  for (const m of NARROW() ? [0, 6, 12, 18, 24] : [0, 4, 8, 12, 16, 20, 24]) g += `<text x="${X(m).toFixed(1)}" y="${H - 8}" text-anchor="${m === 0 ? 'start' : m === 24 ? 'end' : 'middle'}">${m}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Накопленная валовая экономия, млн тг, по месяцам от старта">${g}</svg>`;
}

// ---------- состояние
const fresh = () => ({

  finance: { ...DATA.FINANCE }, journal: [], justRepaired: -1,

let st = fresh();
const ROLES = ['Оператор и бригада', 'Энергетик', 'Финансист', 'Принято'];
function log(i, role, text) { const e = { t: now(), id: C[i].id, role, text }; st.cases[i].log.push(e); st.journal.push(e) }

// ---------- правила приёмки (логика исходного MVP)
function status(i) {
  const c = C[i], s = st.cases[i], full = c.days === S;
  const delta = full ? c.expected - c.actual : null, pct = delta === null ? null : delta / c.expected * 100;
  const quality = full && s.meter && s.comparable && s.system;
  const measurable = delta !== null && delta > 0 && pct > c.uncertainty;
  const tariffOk = Number.isFinite(+s.tariff) && +s.tariff > 0 && String(s.tariff).trim() !== '';
  const valid = quality && measurable && s.repair && s.technical && s.variable && tariffOk;
  return { full, delta, pct, quality, measurable, tariffOk, valid, cash: valid ? delta * +s.tariff : null, accepted: valid && s.stage === 3 };
}
const preOver = c => { const b = c.daily.slice(0, S), m = c.modelDaily.slice(0, S); return (b.reduce((a, x) => a + x, 0) - m.reduce((a, x) => a + x, 0)) / m.reduce((a, x) => a + x, 0) * 100 };
const extraPerDay = c => (c.rawBase - c.modelDaily.slice(0, S).reduce((a, x) => a + x, 0)) / S;
function phase(i) {
  const s = st.cases[i], c = C[i];
  if (s.closed) return { label: 'Нет экономии', cls: 'muted', step: 2, stop: true };
  if (s.stage === 3) return { label: 'Принято', cls: 'ok', step: 4 };
  if (s.stage === 1 && c.kind === 'missing') return { label: s.requested ? 'Ждёт данных' : 'Мало данных', cls: 'bad', step: 2, stop: true };
  return [{ label: 'Ждёт устранения', cls: 'heat', step: 1 }, { label: 'Ждёт замера', cls: 'heat', step: 2 }, { label: 'Ждёт финансиста', cls: 'heat', step: 3 }][s.stage];
}

function act(i, a) {
  const s = st.cases[i], q = status(i);
  if (a === 'repair' && s.stage === 0) { s.repair = true; s.stage = 1; st.justRepaired = i; log(i, 'Бригада', `Устранение зафиксировано: акт Р-0${i + 1}, работы после изоляции и сброса давления.`); toast('Устранение зафиксировано') }
  else if (a === 'technical' && s.stage === 1 && q.quality && q.measurable) { s.technical = true; s.stage = 2; log(i, 'Энергетик', `Технический результат принят: ${kwh(q.delta)} кВт·ч к базе за 30 суток.`); toast('Технический результат принят') }
  else if (a === 'accept' && s.stage === 2 && q.valid) { s.stage = 3; log(i, 'Финансист', `Денежный эффект принят: ${F(q.delta)} кВт·ч × ${F(+s.tariff, 2)} тг = ${mln(q.cash, 2)} млн тг.`); toast('Экономия принята') }
  else if (a === 'close' && s.stage === 1 && C[i].kind === 'output' && s.comparable && !s.closed) { s.closed = 'no-saving'; log(i, 'Энергетик', 'Закрыто без экономии: расход снизился вместе с выпуском.'); toast('Контур закрыт: экономии нет') }
  else if (a === 'request' && s.stage === 1 && C[i].kind === 'missing' && !s.requested) { s.requested = true; log(i, 'Энергетик', 'Запрошено восстановление учёта за 3 суток; приёмка заблокирована.'); toast('Запрос на восстановление учёта отправлен') }
  else return false;
  render(); return true;
}
function setCheck(i, key, value) {
  const s = st.cases[i]; s[key] = !!value;
  if (['meter', 'comparable', 'system'].includes(key) && s.stage >= 2) { s.stage = 1; s.technical = false; log(i, 'Энергетик', 'Условия изменились: приёмка снята, нужна повторная проверка.') }
  else if (key === 'variable' && s.stage === 3) { s.stage = 2; log(i, 'Финансист', 'Основание стоимости изменилось: финансовая приёмка снята.') }
  if (key === 'comparable' && !value && s.closed) s.closed = null;

}

// ---------- экономика
function values(v) {
  const x = {};
  for (const k of ['qty', 'unit', 'launch', 'months', 'co2']) { const raw = v[k]; x[k] = Number(raw); if (raw === null || raw === undefined || String(raw).trim() === '' || !Number.isFinite(x[k]) || x[k] < 0 || x[k] > 1e10) return { valid: false, bad: k } }
  if (!Number.isInteger(x.qty)) return { valid: false, bad: 'qty' };
  if (!Number.isInteger(x.months) || x.months > 60) return { valid: false, bad: 'months' };
  const gross = x.qty * x.unit / 1e6, cover = x.launch === 0 ? 0 : gross > 0 ? x.months + x.launch / gross * 12 : null;
  return { valid: true, ...x, gross, cover, tco2: x.qty / 1000 * x.co2 };
}

    const key = cls === 'done' ? 'Готово' : cls === 'cur' ? 'Сейчас' : cls === 'stop' ? 'Остановлено' : 'Дальше';
    const title = cls === 'stop' ? (s.closed ? 'Экономии нет' : 'Мало данных') : n;
    return `<li class="${cls}"><span class="s-k">${key}</span><span class="s-t">${cls === 'done' ? ico('check') : ''}${title}</span><span class="s-w">${esc(who[k])}</span></li>`;
  }).join('') + '</ol>';
}

function viewCircuit() {
  const i = sel, c = C[i], s = st.cases[i], q = status(i), p = phase(i), before = s.stage === 0;
  const over = preOver(c);
  const finding = s.closed ? 'Расход снизился вместе с выпуском. <b>Экономии нет</b> — контур закрыт.'
    : s.stage === 3 ? `Экономия принята: <b>${kwh(q.delta)} кВт·ч</b> и <b>${mln(q.cash, 2)} млн тг</b> за 30 суток.`
    : before ? `ИИ видит перерасход <b>+${F(over, 1)} %</b> к модели при том же выпуске. Нужно найти и устранить причину.`
    : c.kind === 'missing' ? `Учёт за <b>${c.days} из 30 суток</b>. Пока данных нет, эффект не признаётся.`
    : c.kind === 'output' ? `Сырой расход ниже на <b>${kwh(c.rawBase - c.actual)} кВт·ч</b>, но упал и выпуск. Проверьте базу.`
    : `После устранения расход ниже базы на <b>${kwh(q.delta)} кВт·ч</b> за 30 суток.`;
  const tabs = `<div class="ctabs" role="tablist" aria-label="Учебные контуры">` + C.map((x, k) => { const ph = phase(k); return `<button class="ctab" role="tab" aria-selected="${k === i}" data-sel="${k}"><b>${x.id} · ${esc(x.name)}</b><span>${esc(x.role)}</span><span class="pill ${ph.cls}">${ph.label}</span></button>` }).join('') + '</div>';
  // KPI под графиком
  let kp;
  if (before) kp = `<div><small>Перерасход к модели ИИ</small><b class="lead">+${F(over, 1)}<u>%</u></b><em>30 суток до меры</em></div><div><small>Лишний расход</small><b>${F(extraPerDay(c) / 1000, 1)}<u>тыс. кВт·ч/сут</u></b><em>к модели при том же выпуске</em></div><div><small>Эффект в деньгах</small><b class="dash">—</b><em>нужны устранение и замер</em></div>`;
  else kp = `<div><small>Разница к базе</small><b class="lead">${q.delta === null ? '<span style="color:var(--faint)">—</span>' : F(q.delta / 1000)}<u>${q.delta === null ? 'учёт неполный' : 'тыс. кВт·ч'}</u></b><em>${q.delta === null ? `${c.days} из 30 суток` : 'база приведена к выпуску'}</em></div><div><small>К нормализованной базе</small><b>${q.pct === null ? '<span style="color:var(--faint)">—</span>' : F(q.pct, 1)}<u>%</u></b><em>погрешность учёта ${c.uncertainty} %</em></div><div><small>Эффект в деньгах</small>${q.accepted ? `<b>${mln(q.cash, 2)}<u>млн тг</u></b><em class="ok">принято за 30 суток</em>` : `<b class="dash">—</b><em>${s.closed ? 'не экономия' : 'не принят'}</em>`}</div>`;
  const chartBlock = `<section class="card"><div class="card-h"><h2>Суточный расход, тыс. кВт·ч</h2><div class="legend"><span><i style="border-color:#8c8c8c"></i>До меры</span><span><i style="border-color:var(--heat)"></i>После меры</span><span><i class="d" style="border-color:#7a7a7a"></i>База для текущего выпуска</span></div></div>
    <div class="chart" id="dchart">${dailyChart(c, { hideAfter: before })}</div>
    ${before ? '<p class="note" style="margin:-4px 0 0">Справа появится замер после устранения: 30 суток со счётчика.</p>' : ''}
    <div style="margin:18px 0 6px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><span class="note"><b>Перерасход к модели ИИ по суткам</b></span>${heatScale()}</div>
    ${heatStrip(c, { hideAfter: before })}
    <div class="kpis" style="margin-top:20px">${kp}</div></section>`;
  // задача текущей роли
  let t = '', btns = '', reason = '';
  const chk = (k, label, sub, dis) => `<label class="check"><input type="checkbox" data-check="${k}" ${s[k] ? 'checked' : ''} ${dis ? 'disabled' : ''}><span>${label}${sub ? `<small>${sub}</small>` : ''}</span></label>`;
  if (s.closed) t = `<h3>Закрыто: экономии нет</h3><p>Снижение сырого расхода — следствие меньшего выпуска. Такое снижение не переводится в тенге.</p>`;
  else if (s.stage === 0) {
    t = `<h3>Зафиксировать устранение</h3><p>${esc(c.story)}</p>`;
    btns = `<button class="btn primary" data-act="repair">Зафиксировать устранение</button>`;
    reason = `<p class="reason">${ico('info')}Ремонт — только по допуску, после изоляции участка и сброса давления.</p>`;
  } else if (s.stage === 1) {
    t = `<h3>Проверить замер</h3><p>${c.kind === 'missing' ? 'Счётчик передал не все сутки.' : c.kind === 'output' ? 'В том же периоде загрузку снизили на 10 %. База пересчитана на текущий выпуск.' : 'Сравните 30 суток после меры с базой при том же выпуске.'}</p>
      <div style="margin-top:10px">${chk('meter', 'Счётчик пригоден, учёт полный', `${c.days} из 30 суток${c.kind === 'missing' ? ' — подтвердить нельзя' : ''}`, c.kind === 'missing')}${chk('comparable', 'База приведена к выпуску и режиму', c.kind === 'output' ? `база ${mln(c.expected, 2)} млн вместо ${mln(c.rawBase, 2)} млн кВт·ч` : '')}${chk('system', 'Расход всей системы снизился, переноса нет')}</div>`;
    btns = `<button class="btn primary" data-act="technical" ${q.quality && q.measurable ? '' : 'disabled'}>Принять технический результат</button>`;
    if (c.kind === 'output') btns += `<button class="btn" data-act="close" ${s.comparable ? '' : 'disabled'}>Закрыть: экономии нет</button>`;
    if (c.kind === 'missing') btns += `<button class="btn" data-act="request" ${s.requested ? 'disabled' : ''}>${s.requested ? 'Запрос отправлен' : 'Запросить данные'}</button>`;
    reason = !q.full ? `<p class="reason bad">${ico('stop')}Получено ${c.days} из 30 суток. Приёмка заблокирована до восстановления учёта.</p>`
      : (s.comparable && !q.measurable) ? `<p class="reason bad">${ico('stop')}После приведения базы разница ${F(q.delta)} кВт·ч: положительного эффекта нет.</p>`
      : !q.quality ? `<p class="reason">${ico('info')}Отметьте все три проверки, чтобы принять результат.</p>`
      : `<p class="reason ok">${ico('check')}Разница ${F(q.pct, 1)} % больше погрешности учёта ${c.uncertainty} %.</p>`;
  } else if (s.stage === 2) {
    t = `<h3>Принять денежный эффект</h3><p>Деньги — только принятые кВт·ч, умноженные на переменную часть тарифа.</p>
      <div style="margin-top:14px" class="field"><label for="tariff">Переменная стоимость, тг/кВт·ч</label><input id="tariff" data-tariff type="number" min="0" step="0.01" value="${esc(s.tariff)}" aria-invalid="${!q.tariffOk}"><small>Допущение для учебного примера; в пилоте — по договору.</small></div>
      <div style="margin-top:8px">${chk('variable', 'Переменная часть подтверждена, двойного счёта нет')}</div>
      <div class="nested" style="margin-top:12px"><span class="formula" id="cashFormula">${F(q.delta)} <u>кВт·ч ×</u> ${q.tariffOk ? F(+s.tariff, 2) : '—'} <u>тг =</u> ${q.tariffOk ? mln(q.delta * s.tariff, 2) : '—'} <u>млн тг</u></span></div>`;
    btns = `<button class="btn primary" data-act="accept" ${q.valid ? '' : 'disabled'}>Принять денежный эффект</button>`;
    reason = !q.tariffOk ? `<p class="reason bad">${ico('stop')}Укажите стоимость больше нуля.</p>` : !s.variable ? `<p class="reason">${ico('info')}Нужна отметка финансиста.</p>` : '';
  } else {
    t = `<h3>Экономия принята</h3><p>${F(q.delta)} кВт·ч × ${F(+s.tariff, 2)} тг = <b style="color:#fff">${mln(q.cash, 2)} млн тг</b> за 30 суток. Годовую экономию по одному месяцу не заявляем.</p>`;
    btns = `<a class="btn" href="#/economics">Экономика ДЗО ${ico('arrow')}</a>`;
    reason = `<p class="reason ok">${ico('check')}Записано в журнал решений с ролями и временем.</p>`;
  }
  const task = `<section class="card task" id="task"><div class="card-h"><h2>${s.closed || s.stage === 3 ? 'Итог' : 'Решение'}</h2><span>${s.closed ? 'Энергетик' : ROLES[s.stage]}</span></div>${t}${reason}${btns ? `<div class="actions">${btns}</div>` : ''}</section>`;
  const logCard = `<section class="card"><div class="card-h"><h2>Журнал ${c.id}</h2><span>${s.log.length ? s.log.length + ' ' + plural(s.log.length, 'запись', 'записи', 'записей') : ''}</span></div>${s.log.length ? '<ol class="log">' + s.log.slice().reverse().slice(0, 4).map(e => `<li><time>${e.t}</time><span><b>${esc(e.role)}.</b> ${esc(e.text)}</span></li>`).join('') + '</ol>' : `<p class="empty">Решений по контуру пока нет.</p>`}<p class="note" style="margin-top:12px">${esc(c.plant)}</p></section>`;
  return { crumbs: ['Контуры', `${c.id} · ${c.name}`], html: `<div class="titlerow"><div><h1>${c.id} · ${esc(c.name)}</h1><p>${finding}</p></div><div class="actions"><span class="pill ${p.cls}">${p.label}</span></div></div>${tabs}${routeStrip(i)}<div class="grid g-main">${chartBlock}<div class="stack">${task}${logCard}</div></div>` };
}
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c };

function viewOverview() {
  const qs = C.map((_, i) => status(i)), ph = C.map((_, i) => phase(i));
  const accKwh = qs.reduce((a, q) => a + (q.accepted ? q.delta : 0), 0), accCash = qs.reduce((a, q) => a + (q.accepted ? q.cash : 0), 0);
  const waiting = ph.filter(p => !p.stop && p.step < 4).length, stopped = ph.filter(p => p.stop).length;
  const next = ph.findIndex(p => !p.stop && p.step < 4);
  const finding = accKwh > 0
    ? `Принято <b>${kwh(accKwh)} кВт·ч</b> и <b>${mln(accCash, 2)} млн тг</b> за 30 суток. ${waiting ? `Ещё ${waiting} ${plural(waiting, 'контур ждёт', 'контура ждут', 'контуров ждут')} решения.` : 'Очередь решений пуста.'}`
    : `ИИ нашёл перерасход на трёх контурах компрессорных. Денег пока не принято: ${next >= 0 ? `<b>${C[next].id}</b> ${ph[next].label.toLowerCase()}.` : 'очередь пуста.'}`;
  const kp = `<section class="card kpis"><div><small>Принято за 30 суток</small><b class="lead">${accKwh ? F(accKwh / 1000) : '0'}<u>тыс. кВт·ч</u></b><em>${accKwh ? 'энергетик и финансист' : 'ничего не принято'}</em></div><div><small>В деньгах</small><b>${accCash ? mln(accCash, 2) : '0'}<u>млн тг</u></b><em>переменная часть тарифа</em></div><div><small>Ждут решения</small><b>${waiting}<u>из 3</u></b><em>${waiting ? 'устранение, замер или деньги' : 'нет'}</em></div><div><small>Не признано</small><b>${stopped}<u>из 3</u></b><em>${stopped ? 'нет экономии или учёта' : 'пока нет'}</em></div></section>`;
  const hm = `<section class="card"><div class="card-h"><h2>Перерасход к модели ИИ по суткам</h2>${heatScale()}</div>` + C.map((c, i) => {
    const s = st.cases[i];
    const after = s.stage === 0 ? null : (() => { const a = c.daily.slice(S), m = c.modelDaily.slice(S), n = a.filter(x => x !== null).length; if (n < 30) return null; return (a.reduce((x, y) => x + y, 0) - m.reduce((x, y) => x + y, 0)) / m.reduce((x, y) => x + y, 0) * 100 })();
    return `<div class="hm-row"><div class="id"><b>${c.id}</b><span>${esc(c.name)}</span></div>${heatStrip(c, { hideAfter: s.stage === 0 })}<div class="v"><span>до +${F(preOver(c), 1)} %</span><b>${s.stage === 0 ? 'после —' : after === null ? 'после: нет учёта' : 'после ' + (after > 0 ? '+' : '') + F(after, 1) + ' %'}</b></div></div>`;
  }).join('') + `<div class="hm-axis"><span></span><div><span>${DATA.ddmm(0)}</span><span>устранение ${DATA.ddmm(29)}</span><span>${DATA.ddmm(59)}</span></div><span></span></div></section>`;
  const rows = C.map((c, i) => { const q = qs[i], p = ph[i], s = st.cases[i]; const who = s.closed || p.step === 4 ? '—' : p.stop ? 'Энергетик · учёт' : ROLES[s.stage]; return `<tr class="clickable" data-open="${i}"><td><b>${c.id}</b><span class="sub">${esc(c.name)}</span></td><td><span class="pill ${p.cls}">${p.label}</span></td><td class="hide-sm">${who}</td><td class="num">${s.stage === 0 ? '<span style="color:var(--faint)">—</span>' : q.delta === null ? '<span style="color:var(--faint)">—</span>' : F(q.delta)}<span class="sub">кВт·ч к базе</span></td><td class="num"><a class="btn" href="#/circuits/${c.id}">Открыть</a></td></tr>` }).join('');
  const queue = `<section class="card" style="display:flex;flex-direction:column"><div class="card-h"><h2>Очередь решений</h2><span>3 учебных контура</span></div><table class="queue"><thead><tr><th>Контур</th><th>Шаг</th><th class="hide-sm">Кто дальше</th><th class="num">Разница, 30 суток</th><th class="num"><span class="sr">Действие</span></th></tr></thead><tbody>${rows}</tbody></table><p class="note" style="margin-top:auto;padding-top:14px">Каждое решение попадает в <a href="#/journal">журнал</a> с ролью и временем.</p></section>`;
  const how = `<section class="card"><div class="card-h"><h2>Как принимается экономия</h2></div><ol class="steps">${[['ИИ находит потерю', 'Расход выше модели при том же выпуске.'], ['Бригада устраняет', 'По допуску, после изоляции и сброса давления.'], ['Энергетик принимает замер', '30 суток, база приведена к выпуску.'], ['Финансист принимает деньги', 'кВт·ч × переменная часть тарифа.']].map((x, k) => `<li><span class="n">${k + 1}</span><div><b>${x[0]}</b><p>${x[1]}</p></div></li>`).join('')}</ol></section>`;
  return { crumbs: ['Обзор'], html: `<div class="titlerow"><div><h1>Обзор пилота</h1><p>${finding}</p></div><div class="actions">${next >= 0 ? `<a class="btn primary" href="#/circuits/${C[next].id}">Открыть ${C[next].id} ${ico('arrow')}</a>` : ''}</div></div>${kp}${hm}<div class="grid g-main" style="align-items:stretch">${queue}${how}</div>` };
}

function viewEconomics() {
  const f = st.finance, r = values(f);
  const scen = DATA.SCENARIOS.map(([p, q]) => `<button data-scenario="${q}" aria-pressed="${r.valid && r.qty === q}">${p} %</button>`).join('');
  const fld = (k, label, step, sub) => `<div class="field"><label for="f-${k}">${label}</label><input id="f-${k}" type="number" min="0" step="${step}" data-finance="${k}" value="${esc(f[k])}" aria-invalid="${!r.valid && r.bad === k}">${sub ? `<small>${sub}</small>` : ''}</div>`;
  const head = r.valid ? `Сценарий одного ДЗО: <b>${mln(r.gross * 1e6, 1)} млн тг</b> валовой экономии в год. До эксплуатационных затрат и налогов.` : 'Проверьте допущения: нужны неотрицательные числа, количество и месяцы — целые.';
  const kp = r.valid ? `<div><small>Валовая экономия в год</small><b class="lead">${F(r.gross, 1)}<u>млн тг</u></b><em>${F(r.qty / 1e6, 2)} млн кВт·ч × ${F(r.unit, 2)} тг</em></div><div><small>Разовый запуск</small><b>${F(r.launch, 1)}<u>млн тг</u></b><em>пилот, ${F(r.months)} мес.</em></div><div><small>Покрытие запуска</small><b>${r.cover === null ? '<span style="color:var(--faint)">—</span>' : F(r.cover, 1)}<u>мес.</u></b><em>от старта, до опер. затрат</em></div><div><small>Меньше выбросов CO₂</small><b>${F(r.tco2)}<u>т/год</u></b><em>при ${F(r.co2, 2)} т/МВт·ч</em></div>` : '<div><small>Расчёт</small><b class="dash">—</b><em>исправьте поле с красной рамкой</em></div>';
  const budget = `<section class="card"><div class="card-h"><h2>Бюджет пилота</h2><span>млн тг</span></div><table><tbody>${DATA.BUDGET.map(b => `<tr><td>${b[0]}<span class="sub">${b[2]}</span></td><td class="num">${F(b[1])}</td></tr>`).join('')}<tr><td><b>Итого</b></td><td class="num"><b>${F(DATA.BUDGET.reduce((a, b) => a + b[1], 0))}</b></td></tr></tbody></table></section>`;
  const not = `<section class="card"><div class="card-h"><h2>Что не считается экономией</h2></div><ul class="steps">${[['Снижение выпуска', 'Меньше продукции — меньше энергии. Это не экономия (контур EC-02).'], ['Неполный учёт', 'Без 30 суток показаний эффект не признаём (EC-03).'], ['Постоянная часть тарифа', 'Считаем только переменную стоимость кВт·ч.'], ['Один месяц', 'Годовой эффект подтверждает пилот, а не одна выборка.']].map(x => `<li style="grid-template-columns:1fr"><div><b>${x[0]}</b><p>${x[1]}</p></div></li>`).join('')}</ul></section>`;
  return { crumbs: ['Экономика'], html: `<div class="titlerow"><div><h1>Экономика ДЗО</h1><p id="econHead">${head}</p></div><div class="actions"><button class="btn" data-restore>${ico('reset')}Базовые допущения</button></div></div>
    <div class="grid g-main"><div class="stack"><section class="card"><div class="card-h"><h2>Накопленная валовая экономия, млн тг</h2><span>месяцев от старта</span></div><div class="chart" id="echart">${econChart(r)}</div><div class="kpis" style="margin-top:18px" id="ekpis">${kp}</div></section>${not}</div>
    <div class="stack"><section class="card"><div class="card-h"><h2>Допущения</h2><span>меняйте числа</span></div><div class="field" style="margin-bottom:14px"><span>Снижение от базы ${F(DATA.BASE_KWH / 1e6)} млн кВт·ч в год</span><div class="seg" role="group" aria-label="Сценарий снижения">${scen}</div></div><div class="grid" style="gap:14px">${fld('qty', 'Избегаемый расход, кВт·ч/год', 1)}${fld('unit', 'Переменная стоимость, тг/кВт·ч', 'any')}<div class="grid g-2" style="gap:14px">${fld('launch', 'Запуск, млн тг', 'any')}${fld('months', 'Внедрение, мес.', 1)}</div>${fld('co2', 'Выбросы сети, т CO₂/МВт·ч', 'any', 'Допущение: подтвердить коэффициент для энергосистемы ДЗО.')}</div></section>${budget}</div></div>` };
}

function viewRollout() {
  const R = DATA.ROLLOUT;
  const tree = `<section class="card"><div class="card-h"><h2>Один сервис — все направления</h2><span>метод общий, данные местные</span></div><div class="tree"><div class="core"><b>Общий сервис КМГ</b><span>Сигнал ИИ · устранение по допуску · замер · приёмка денег · журнал</span></div><div class="br">${R.branches.map(b => `<div><b>${b[0]}</b><span>${b[1]}</span></div>`).join('')}</div></div><ol class="steps" style="margin-top:12px">${R.steps.map((x, k) => `<li><span class="n">${k + 1}</span><div><b>${x[0]}</b><p>${x[1]}</p></div></li>`).join('')}</ol><p class="note" style="margin-top:8px">${R.rules}</p></section>`;
  const pilot = `<section class="card"><div class="card-h"><h2>Условия пилота</h2><span>предложение автора</span></div><dl class="dl"><dt>Объём</dt><dd>1 ДЗО · 3 контура</dd><dt>Срок</dt><dd>4 месяца</dd><dt>Первая очередь</dt><dd>Технический воздух</dd><dt>Метод замера</dt><dd>DOE FEMP M&V 5.0</dd><dt>Бюджет</dt><dd>36 млн тг</dd></dl></section>`;
  const crit = `<section class="card"><div class="card-h"><h2>Критерии конкурса</h2></div><ol class="steps">${[['Здоровье, безопасность, среда', 'Меньше энергии — меньше выбросов CO₂; утечки устраняют по допуску, после сброса давления; меньше шума от утечек.'], ['Тиражирование', 'Одно ядро для добычи, переработки, транспорта и сервиса; ДЗО подключает свои счётчики.'], ['Деньги', 'Только принятые кВт·ч × переменная стоимость. Сценарий — 90 млн тг/год на ДЗО.']].map((x, k) => `<li><span class="n">${k + 1}</span><div><b>${x[0]}</b><p>${x[1]}</p></div></li>`).join('')}</ol></section>`;
  return { crumbs: ['Перенос в ДЗО'], html: `<div class="titlerow"><div><h1>Перенос в ДЗО</h1><p>Один метод приёмки для всех ДЗО. <b>Деньги каждое ДЗО считает само</b>, без умножения чужой суммы.</p></div></div><div class="grid g-main">${tree}<div class="stack">${pilot}${crit}</div></div>` };
}

function viewJournal() {
  const J = st.journal;
  const body = J.length ? `<table class="jt"><thead><tr><th>Время</th><th>Контур</th><th>Роль</th><th>Решение</th></tr></thead><tbody>${J.slice().reverse().map(e => `<tr><td class="num" style="text-align:left;color:var(--faint)">${e.t}</td><td><b>${e.id}</b></td><td>${esc(e.role)}</td><td>${esc(e.text)}</td></tr>`).join('')}</tbody></table>` : `<p class="empty">Решений пока нет. Откройте <a href="#/circuits/EC-01">EC-01</a> и зафиксируйте устранение.</p>`;
  return { crumbs: ['Журнал решений'], html: `<div class="titlerow"><div><h1>Журнал решений</h1><p>Каждое решение с ролью и временем: ${J.length ? `<b>${J.length} ${plural(J.length, 'запись', 'записи', 'записей')}</b>` : 'пока пусто'}. Ложные выводы тоже сохраняются.</p></div><div class="actions"><button class="btn" data-export>${ico('download')}Данные JSON</button><button class="btn" data-reset>${ico('reset')}Начать заново</button></div></div><section class="card">${body}</section>` };
}

function viewSources() {
  const src = `<section class="card"><div class="card-h"><h2>Источники</h2><span>проверено 20.10.2026</span></div>${DATA.SOURCES.map(s => `<article class="src"><span class="k">[${s.n}] ${esc(s.kind)} · ${esc(s.date)}</span><h3>${esc(s.title)}</h3><p>${esc(s.claim)}</p>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">Открыть первоисточник</a>` : ''}</article>`).join('')}</section>`;
  const ctl = `<section class="card"><div class="card-h"><h2>Данные и контроль ИИ</h2></div><ol class="steps">${DATA.CONTROLS.map((x, k) => `<li style="grid-template-columns:1fr"><div><b>${x[0]}</b><p>${x[1]}</p></div></li>`).join('')}</ol></section>`;
  const facts = `<section class="card"><div class="card-h"><h2>Что уже делает КМГ</h2><span>отчёт за 2025 год [1]</span></div><dl class="dl"><dt>Энергопотребление группы</dt><dd>${F(DATA.KMG.total, 1)} млн ГДж</dd><dt>Мероприятий за год</dt><dd>${DATA.KMG.measures}</dd><dt>Годовая экономия</dt><dd>${F(DATA.KMG.saved, 3)} млн ГДж</dd></dl><p class="note" style="margin-top:10px">Проект не присваивает эти результаты: он добавляет проверку эффекта каждой меры.</p></section>`;
  return { crumbs: ['Источники'], html: `<div class="titlerow"><div><h1>Источники и контроль ИИ</h1><p>Факты — из открытых источников. <b>Все данные MVP синтетические</b>: контуры, ряды и решения вымышлены.</p></div></div><div class="grid g-main">${src}<div class="stack">${facts}${ctl}</div></div>` };
}

// ---------- отрисовка
function render() {
  parse();
  const v = { overview: viewOverview, circuits: viewCircuit, economics: viewEconomics, rollout: viewRollout, journal: viewJournal, sources: viewSources }[route]();
  $('#crumbs').innerHTML = ['ДЗО-пилот'].concat(v.crumbs).map((x, k, a) => k === a.length - 1 ? `<b>${esc(x)}</b>` : `<span>${esc(x)}</span><i>/</i>`).join('');
  const changed = $('#view').dataset.route !== route + sel;
  $('#view').innerHTML = v.html; $('#view').dataset.route = route + sel;
  if (changed) { $('#view').classList.remove('view'); void $('#view').offsetWidth; $('#view').classList.add('view') }
  for (const a of $$('.nav a')) a.dataset.r === route ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  const open = C.filter((_, i) => { const p = phase(i); return !p.stop && p.step < 4 }).length;
  $('#navCount').textContent = open ? String(open) : '';
  document.title = (v.crumbs[v.crumbs.length - 1]) + ' · Энергоконтур';
  if (st.justRepaired === sel && route === 'circuits') { const p = $('#dchart path.after'); if (p && p.getTotalLength) { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.getBoundingClientRect(); p.style.transition = 'stroke-dashoffset 1.4s cubic-bezier(.16,1,.3,1)'; p.style.strokeDashoffset = 0 } }
  st.justRepaired = -1;
  $('.side').classList.remove('open');
}
function updateEconomics() { // поля не перерисовываются, чтобы не терять фокус
  const r = values(st.finance);
  $('#echart').innerHTML = econChart(r);
  $('#econHead').innerHTML = r.valid ? `Сценарий одного ДЗО: <b>${F(r.gross, 1)} млн тг</b> валовой экономии в год. До эксплуатационных затрат и налогов.` : 'Проверьте допущения: нужны неотрицательные числа, количество и месяцы — целые.';
  const html = viewEconomics().html, tmp = document.createElement('div'); tmp.innerHTML = html;
  $('#ekpis').innerHTML = tmp.querySelector('#ekpis').innerHTML;
  for (const i of $$('[data-finance]')) i.setAttribute('aria-invalid', String(!r.valid && r.bad === i.dataset.finance));
  for (const b of $$('[data-scenario]')) b.setAttribute('aria-pressed', String(r.valid && r.qty === +b.dataset.scenario));
}
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), globalThis.EK_TOAST_MS || 2200) }
function exportData() {
  const out = { notice: 'Синтетические данные и учебные решения. Не данные КМГ.', exported: new Date().toISOString(), circuits: C.map(({ id, name, kind, rawBase, expected, actual, days, uncertainty, daily }) => ({ id, name, kind, rawBase, expected, actual, days, uncertainty, daily })), finance: st.finance, state: st.cases, journal: st.journal };
  const url = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' })), a = document.createElement('a');
  a.href = url; a.download = 'energokontur_synthetic.json'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// ---------- тема: угольная (по умолчанию) или светлая; выбор запоминается в браузере
function setTheme(t) {
  if (t === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('ek.theme', t) } catch (e) {}
  $('#themeBtn').setAttribute('aria-label', t === 'light' ? 'Тёмная тема' : 'Светлая тема');
  render();
}

// ---------- события
document.addEventListener('click', e => {
  const b = e.target.closest('button,tr[data-open]'); if (!b || b.disabled) return;
  if (b.dataset.sel !== undefined) { location.hash = '#/circuits/' + C[+b.dataset.sel].id }
  else if (b.dataset.act) act(sel, b.dataset.act);
  else if (b.dataset.open !== undefined && !e.target.closest('a')) location.hash = '#/circuits/' + C[+b.dataset.open].id;
  else if (b.dataset.scenario) { st.finance.qty = +b.dataset.scenario; const i = $('[data-finance=qty]'); if (i) i.value = st.finance.qty; updateEconomics() }
  else if (b.hasAttribute('data-restore')) { st.finance = { ...DATA.FINANCE }; render(); toast('Базовые допущения восстановлены') }
  else if (b.hasAttribute('data-export')) exportData();
  else if (b.hasAttribute('data-reset')) { st = fresh(); render(); toast('Учебный пример начат заново') }
  else if (b.classList.contains('menu-btn')) $('.side').classList.toggle('open');
  else if (b.id === 'themeBtn') setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
});
document.addEventListener('change', e => {
  if (e.target.dataset.check) setCheck(sel, e.target.dataset.check, e.target.checked);
});
document.addEventListener('input', e => {
  if (e.target.dataset.finance) { st.finance[e.target.dataset.finance] = e.target.value; updateEconomics() }
  if (e.target.hasAttribute('data-tariff')) {
    const s = st.cases[sel]; s.tariff = e.target.value; if (s.stage === 3) s.stage = 2;
    const q = status(sel); e.target.setAttribute('aria-invalid', String(!q.tariffOk));
    $('#cashFormula').innerHTML = `${F(q.delta)} <u>кВт·ч ×</u> ${q.tariffOk ? F(+s.tariff, 2) : '—'} <u>тг =</u> ${q.tariffOk ? mln(q.delta * s.tariff, 2) : '—'} <u>млн тг</u>`;
    const btn = $('[data-act=accept]'); if (btn) btn.disabled = !q.valid;
  }
});
window.addEventListener('hashchange', render);
let wasNarrow = innerWidth < 700; addEventListener('resize', () => { const n = innerWidth < 700; if (n !== wasNarrow) { wasNarrow = n; render() } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('.side').classList.remove('open') });

render();
globalThis.EK = { data: DATA, get state() { return st }, render, act: (i, a) => act(i, a), setCheck: (i, k, v) => setCheck(i, k, v), status, values, reset() { st = fresh(); render() }, go(h) { location.hash = h } };
})();

</script>
</body>
</html>
